name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Test suite
        run: python tests/run_tests.py
      - name: CLI smoke
        shell: bash
        run: |
          mrforge capabilities --offline | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and len(d['data']['commands']) > 30, d"
          mrforge plan "make the suit red" --offline | python -c "import json,sys; d=json.load(sys.stdin); assert d['data']['route'] == 'texture', d"
          mrforge facts --grep usmap | python -c "import json,sys; d=json.load(sys.stdin); assert d['data']['facts'], d"

  toolchain:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e .
      - name: Fetch pinned tools from their releases (hash-checked)
        shell: bash
        run: |
          mrforge setup > setup.json || true
          python -c "import json,sys; d=json.load(open('setup.json')); print(json.dumps(d, indent=1)); sys.exit(0 if d['ok'] else 1)"
      - name: Version probes
        shell: bash
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("setup.json"))
          probes = {t["name"]: t.get("probe", {}) for t in d["data"]["tools"]}
          assert "retoc-rivals-cli 3.11.1" in probes["retoc-rivals-cli"]["output"], probes
          assert "UAssetTool v1.5.9" in probes["uassettool"]["output"], probes
          assert probes["fmodel-mcp"]["ok"], probes
          print("probes ok")
          EOF

  install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install twice, check PATH, uninstall
        shell: pwsh
        run: |
          ./Install.ps1 -SkipTests
          ./Install.ps1 -SkipTests
          $bin = Join-Path $env:LOCALAPPDATA 'MarvelRivalsForge\bin'
          $n = ([Environment]::GetEnvironmentVariable('Path','User') -split ';' | Where-Object { $_ -eq $bin }).Count
          if ($n -ne 1) { throw "expected one PATH entry, found $n" }
          Push-Location $env:RUNNER_TEMP
          $out = & (Join-Path $bin 'mrforge.cmd') version | ConvertFrom-Json
          Pop-Location
          if (-not $out.ok) { throw 'mrforge version failed' }
          ./Uninstall.ps1
          $n = ([Environment]::GetEnvironmentVariable('Path','User') -split ';' | Where-Object { $_ -eq $bin }).Count
          if ($n -ne 0) { throw 'PATH entry left behind' }

  release-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build release archive twice (deterministic)
        run: |
          python tools/build_release.py
          cp artifacts/SHA256SUMS first.sums
          python tools/build_release.py
          diff first.sums artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: artifacts/
